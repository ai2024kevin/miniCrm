services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8000
      DATA_DIR: /app/data
      CRM_LOGIN: ${CRM_LOGIN:-admin}
      CRM_PASSWORD: ${CRM_PASSWORD:-admin123}
      CRM_AUTH_TOKEN: ${CRM_AUTH_TOKEN:-change-me}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "4173:4173"
    restart: unless-stopped

volumes:
  backend_data:
